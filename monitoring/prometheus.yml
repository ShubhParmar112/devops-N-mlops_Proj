# Prometheus configuration: scrape the app's /metrics endpoint every 5 seconds.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: diabetes-app
    metrics_path: /metrics
    static_configs:
      - targets: ["diabetes-app:8000"]   # docker compose service name : metrics port
        labels:
          service: diabetes-prediction

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
