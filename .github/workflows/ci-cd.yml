# CI/CD pipeline for the Diabetes Prediction System
#
#  1. test   - install deps, retrain the model (validates the ML pipeline),
#              run pytest incl. the model quality gate
#  2. docker - build the image with the model that passed the tests,
#              smoke-test the running container, and (on main only) push to Docker Hub
#
# Required GitHub secrets for the Docker Hub push (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME  your Docker Hub username
#   DOCKERHUB_TOKEN     a Docker Hub access token with Read & Write scope
# Without them the pipeline still builds and tests the image; it just skips the push.

name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Cancel an older run on the same branch when a newer commit arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: diabetes-prediction

jobs:
  test:
    name: Train & test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify dataset
        run: python src/download_data.py

      - name: Train models (MLflow tracking)
        run: python -m src.train

      - name: Run unit tests
        run: pytest --junitxml=test-results.xml

      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: model
          path: |
            models/diabetes_model.pkl
            models/model_metadata.json
          retention-days: 14

      - name: Upload reports and MLflow runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            test-results.xml
            reports/figures/
            mlflow.db
            mlruns/
          retention-days: 14

  docker:
    name: Build, smoke-test & push image
    needs: test
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      # Push only for commits on main (not PRs, not develop) and only if secrets exist
      SHOULD_PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Use the model that passed the tests
        uses: actions/download-artifact@v4
        with:
          name: model
          path: models/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test container
        run: |
          docker run -d --name smoke -p 8501:8501 ${{ env.IMAGE_NAME }}:ci
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8501/_stcore/health; then echo " -> healthy"; break; fi
            sleep 2
          done
          curl -fs http://localhost:8501/_stcore/health
          docker exec smoke python -W ignore -m src.predict
          docker logs smoke
          docker rm -f smoke

      - name: Log in to Docker Hub
        if: env.SHOULD_PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub
        if: env.SHOULD_PUSH == 'true'
        run: |
          REPO="${DOCKERHUB_USERNAME}/${IMAGE_NAME}"
          SHORT_SHA="${GITHUB_SHA::7}"
          for TAG in latest "sha-${SHORT_SHA}"; do
            docker tag "${IMAGE_NAME}:ci" "${REPO}:${TAG}"
            docker push "${REPO}:${TAG}"
          done
          echo "### Pushed \`${REPO}:latest\` and \`${REPO}:sha-${SHORT_SHA}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Note skipped push
        if: env.SHOULD_PUSH != 'true'
        run: echo "### Docker Hub push skipped (not main, a pull request, or secrets not set)" >> "$GITHUB_STEP_SUMMARY"
